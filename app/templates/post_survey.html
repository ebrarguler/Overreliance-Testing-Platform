{% extends "base.html" %}{% block content %}
<div class="container">
  <h2>Question {{ question_number }} of {{ total_questions }}: your rating</h2>
  <div class="progress-track" role="progressbar" aria-label="Progress through the questions" aria-valuemin="0" aria-valuemax="{{ total_questions }}" aria-valuenow="{{ question_number }}">
    <div class="progress-fill" style="width: {{ (100 * question_number / total_questions) | round(1) }}%"></div>
  </div>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="POST" class="survey-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="position" value="{{ question_number - 1 }}">
    {% for name, label in post_items.items() %}{% include "_likert_item.html" %}{% endfor %}
    <button type="submit" class="survey-btn">{% if is_last_question %}Continue to final survey{% else %}Next question{% endif %}</button>
  </form>
</div>
{% endblock %}
