<fieldset class="form-group">
  <legend>{{ label }}</legend>
  {% set allows_not_needed = name in ['trust', 'helpfulness'] %}
  <div class="likert-scale{% if allows_not_needed %} likert-scale-with-not-needed{% endif %}">
    {% if allows_not_needed %}
    <label class="likert-option likert-option-not-needed" for="{{ name }}_not_needed">
      <input type="radio" id="{{ name }}_not_needed" name="{{ name }}" value="not_needed" {% if request.form.get(name) == "not_needed" %}checked{% endif %} required>
      I didn't need AI assistance
    </label>
    {% endif %}
    {% for i in range(1, 8) %}
    <label class="likert-option" for="{{ name }}_{{ i }}">
      <input type="radio" id="{{ name }}_{{ i }}" name="{{ name }}" value="{{ i }}" {% if request.form.get(name) == i|string %}checked{% endif %} required>
      {{ ['Strongly disagree', 'Disagree', 'Somewhat disagree', 'Neutral', 'Somewhat agree', 'Agree', 'Strongly agree'][i-1] }}
    </label>
    {% endfor %}
  </div>
</fieldset>
