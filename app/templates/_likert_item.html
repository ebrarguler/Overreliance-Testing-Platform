<fieldset class="form-group">
  <legend>{{ label }}</legend>
  <div class="likert-scale">
    {% for i in range(1, 8) %}
    <label class="likert-option" for="{{ name }}_{{ i }}">
      <input type="radio" id="{{ name }}_{{ i }}" name="{{ name }}" value="{{ i }}" {% if request.form.get(name) == i|string %}checked{% endif %} required>
      {{ ['Strongly disagree', 'Disagree', 'Somewhat disagree', 'Neutral', 'Somewhat agree', 'Agree', 'Strongly agree'][i-1] }}
    </label>
    {% endfor %}
  </div>
  {% if name == 'trust' %}<label for="trust_not_needed"><input type="radio" id="trust_not_needed" name="trust" value="not_needed" {% if request.form.get(name) == "not_needed" %}checked{% endif %} required>I didn't need AI assistance</label>{% endif %}
  {% if name == 'trust_chatgpt' %}<label><input type="radio" name="{{ name }}" value="not_used" required>I have not used ChatGPT enough to answer</label>{% endif %}
</fieldset>
